<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consultorio de Imagenología Médica</title>
    <meta name="description" content="Sistema integral de gestión de imagenología médica, citas diagnósticas, visor radiológico y fichas de pacientes." />
    <meta property="og:title" content="Consultorio de Imagenología Médica" />
    <meta property="og:description" content="Sistema integral de gestión de imagenología médica, citas diagnósticas, visor radiológico y fichas de pacientes." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Reglas estrictas anti-caché para navegadores móviles y de escritorio -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <script>
      (function() {
        var APP_BUILD = "v2026.09.07.1";
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(registrations) {
              for (var i = 0; i < registrations.length; i++) {
                registrations[i].unregister();
              }
            }).catch(function() {});
          }
          var lastBuild = localStorage.getItem('__app_build_version__');
          if (lastBuild !== APP_BUILD) {
            if ('caches' in window) {
              caches.keys().then(function(keys) {
                keys.forEach(function(key) { caches.delete(key); });
              }).catch(function() {});
            }
            try {
              var toRemove = [];
              for (var j = 0; j < localStorage.length; j++) {
                var k = localStorage.key(j);
                if (k && (k.startsWith('__temp_') || k.startsWith('vite_') || k.indexOf('stale_') !== -1)) {
                  toRemove.push(k);
                }
              }
              toRemove.forEach(function(k) { localStorage.removeItem(k); });
            } catch (e) {}
            localStorage.setItem('__app_build_version__', APP_BUILD);
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
